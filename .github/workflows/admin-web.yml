name: Admin Web CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build admin web
        run: npm run build
