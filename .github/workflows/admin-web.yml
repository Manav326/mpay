name: Admin Web CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  push:
    branches: [main]

concurrency:
  group: mpay-admin-web-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPAY_PUBLIC_ROOT_URL: ${{ vars.MPAY_PUBLIC_ROOT_URL || 'https://quantaedge.in' }}
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive mPay API origin from the single root domain
        run: python3 ../scripts/mpay-public-config.py --root-url "$MPAY_PUBLIC_ROOT_URL" --format github >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build admin web
        run: npm run build
