name: Admin Web CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'admin-web/**'
      - 'config/public-hosts.env'
      - 'scripts/mpay-public-config.py'
      - '.github/workflows/admin-web.yml'
  push:
    branches: [main]

concurrency:
  group: mpay-admin-web-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive mPay API origin from the single tracked hostname file
        run: python3 ../scripts/mpay-public-config.py --env-file ../config/public-hosts.env --format github >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build admin web
        run: npm run build
