name: Docker Compose CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: mpay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MPAY_BACKEND_IMAGE: ghcr.io/manav326/mpay-backend
  MPAY_ADMIN_WEB_IMAGE: ghcr.io/manav326/mpay-admin-web
  MPAY_WEB_API_BASE_URL: http://192.168.31.47:8080
  MPAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.31.47:3000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate image tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            image_tag="ci-${GITHUB_SHA}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            image_tag="latest"
          else
            branch_name="${GITHUB_REF_NAME#feature/}"
            safe_branch="$(echo "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
            image_tag="feature-${safe_branch}-latest"
          fi

          echo "MPAY_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "MPAY_SHA_TAG=sha-${GITHUB_SHA}" >> "${GITHUB_ENV}"

          echo "Selected image tag: ${image_tag}"
          echo "Commit image tag: sha-${GITHUB_SHA}"

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend and admin web images
        run: |
          docker compose -f docker-compose.yml build backend admin-web

      - name: Push branch/main image
        if: github.event_name == 'push'
        run: |
          docker compose -f docker-compose.yml push backend admin-web

      - name: Tag images with commit SHA
        if: github.event_name == 'push'
        run: |
          docker tag "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"             "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"

          docker tag "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"             "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"

      - name: Push commit-tagged images
        if: github.event_name == 'push'
        run: |
          docker push "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          docker push "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"

      - name: Build summary
        if: always()
        run: |
          echo "Backend image: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Admin Web image: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Commit backend: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          echo "Commit admin web: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"


  android-apk:
    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpay-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
