name: Docker Compose CI

on:
  workflow_dispatch:
    inputs:
      mpay_public_root_url:
        description: Canonical HTTPS root domain. Web, API, CORS and TURN hostnames are derived from this single value.
        type: string
        required: false
        default: https://quantaedge.in
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'docker-compose.yml'
      - 'docker-compose.azure.yml'
      - 'docker-compose.cloudflare.yml'
      - '.env.cloudflare.example'
      - 'infra/caddy/Caddyfile.azure'
      - '.github/workflows/docker-compose.yml'
      - '.github/workflows/azure-admin-web.yml'
      - 'scripts/mpay-github-update.ps1'
      - '.env.azure.example'
      - 'scripts/mpay-*.ps1'
      - 'scripts/mpay-azure-deploy.ps1'
      - 'scripts/mpay-public-config.py'
      - 'tests/test_mpay_public_config.py'

concurrency:
  group: mpay-docker-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MPAY_BACKEND_IMAGE: ghcr.io/manav326/mpay-backend
  MPAY_ADMIN_WEB_IMAGE: ghcr.io/manav326/mpay-admin-web
  MPAY_PUBLIC_ROOT_URL: ${{ inputs.mpay_public_root_url || vars.MPAY_PUBLIC_ROOT_URL || 'https://quantaedge.in' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Derive mPay public URLs from the single root domain
        shell: bash
        run: python3 scripts/mpay-public-config.py --root-url "$MPAY_PUBLIC_ROOT_URL" --format github >> "$GITHUB_ENV"

      - name: Run mPay public URL regression tests
        run: python3 -m unittest discover -s tests -p 'test_mpay_public_config.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate image tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            branch_name="${{ github.event.pull_request.head.ref }}"
            commit_sha="${{ github.event.pull_request.head.sha }}"
            safe_branch="$(echo "${branch_name#feature/}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
            image_tag="feature-${safe_branch}-latest"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            commit_sha="${GITHUB_SHA}"
            image_tag="latest"
          else
            branch_name="${GITHUB_REF_NAME#feature/}"
            safe_branch="$(echo "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
            commit_sha="${GITHUB_SHA}"
            image_tag="feature-${safe_branch}-latest"
          fi

          echo "MPAY_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "MPAY_SHA_TAG=sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "MPAY_ADMIN_WEB_AZURE_TAG=azure-sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "MPAY_COMMIT_SHA=${commit_sha}" >> "${GITHUB_ENV}"

          echo "Selected image tag: ${image_tag}"
          echo "Commit image tag: sha-${commit_sha}"

      - name: Validate Admin API origin
        shell: bash
        run: |
          python3 - "${MPAY_WEB_API_BASE_URL}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          value = sys.argv[1].strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("MPAY_WEB_API_BASE_URL must be a canonical HTTPS API origin.")
          print(f"Admin API origin validated: https://{parsed.netloc}")
          PY

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config

      - name: Validate local deployment overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local-deploy.yml config

      - name: Validate Cloudflare local production overlay
        env:
          MPAY_IMAGE_TAG: sha-ci
          MPAY_ADMIN_WEB_TAG: azure-sha-ci
          MPAY_DB_PASSWORD: ci-validation-only-password-1234567890
          MPAY_PUBLIC_ROOT_URL: https://quantaedge.in
          MPAY_BACKEND_BIND_ADDRESS: 127.0.0.1
          MPAY_ADMIN_WEB_BIND_ADDRESS: 127.0.0.1
          MPAY_BACKEND_HOST_PORT: "18080"
          MPAY_ADMIN_WEB_HOST_PORT: "13000"
          MPAY_AUTH_OTP_PROVIDER: way2api
          MPAY_PAYMENT_GATEWAY_PROVIDERS: razorpay,payu
          MPAY_WITHDRAWAL_PROVIDER_ORDER: razorpay,payu
          MPAY_RECHARGE_EXECUTION_PROVIDERS: payu
          MPAY_PAYU_ENVIRONMENT: production
          MPAY_PAYU_AUTH_BASE_URL: https://auth.payu.example
          MPAY_PAYU_NBC_BASE_URL: https://nbc.payu.example
          MPAY_PAYU_AGENT_ID: ci-agent
          MPAY_PAYU_PG_VERIFY_URL: https://pg.payu.example/verify
          MPAY_PAYU_PG_SUCCESS_URL: https://cbjs.payu.in/sdk/success
          MPAY_PAYU_PG_FAILURE_URL: https://cbjs.payu.in/sdk/failure
          MPAY_PAYU_PG_PRODUCTION: "true"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml config --quiet

      - name: Validate Azure deployment overlay
        env:
          MPAY_IMAGE_TAG: sha-ci
          MPAY_ADMIN_WEB_TAG: azure-sha-ci
          MPAY_PUBLIC_DOMAIN: mpay.example.test
          MPAY_API_DOMAIN: api-mpay.example.test
          MPAY_CALL_TURN_REALM: turn-mpay.example.test
          MPAY_CALL_TURN_EXTERNAL_IP: 198.51.100.10
          MPAY_CALL_TURN_USERNAME: ci
          MPAY_CALL_TURN_CREDENTIAL: ci
          MPAY_CALL_ICE_SERVERS: stun:stun.l.google.com:19302,turn:turn-mpay.example.test:3478?transport=udp,turn:turn-mpay.example.test:3478?transport=tcp
        run: |
          docker compose -f docker-compose.yml -f docker-compose.azure.yml config

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/mpay-local-deploy.ps1',
            'scripts/mpay-cloudflare-deploy.ps1',
            'scripts/mpay-db-backup.ps1',
            'scripts/mpay-db-restore.ps1',
            'scripts/mpay-azure-deploy.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Host 'PowerShell deployment scripts parsed successfully.'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend and admin web images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --tag "${MPAY_BACKEND_IMAGE}:${MPAY_IMAGE_TAG}" \
            --tag "${MPAY_BACKEND_IMAGE}:${MPAY_SHA_TAG}" \
            --cache-from "type=gha,scope=mpay-backend" \
            --cache-to "type=gha,mode=max,scope=mpay-backend" \
            --push \
            backend

          docker buildx build \
            --file admin-web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${MPAY_WEB_API_BASE_URL}" \
            --tag "${MPAY_ADMIN_WEB_IMAGE}:${MPAY_IMAGE_TAG}" \
            --tag "${MPAY_ADMIN_WEB_IMAGE}:${MPAY_SHA_TAG}" \
            --tag "${MPAY_ADMIN_WEB_IMAGE}:${MPAY_ADMIN_WEB_AZURE_TAG}" \
            --cache-from "type=gha,scope=mpay-admin-web" \
            --cache-to "type=gha,mode=max,scope=mpay-admin-web" \
            --push \
            admin-web

      - name: Build images for external pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --tag "${MPAY_BACKEND_IMAGE}:${MPAY_SHA_TAG}" \
            --load \
            backend

          docker buildx build \
            --file admin-web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${MPAY_WEB_API_BASE_URL}" \
            --tag "${MPAY_ADMIN_WEB_IMAGE}:${MPAY_SHA_TAG}" \
            --load \
            admin-web

      - name: Verify pushed images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker pull "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"
          docker pull "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"
          docker pull "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          docker pull "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"
          docker pull "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_ADMIN_WEB_AZURE_TAG}"

      - name: Build summary
        if: always()
        run: |
          echo "Backend image: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Admin Web image: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Commit backend: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          echo "Commit admin web: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"
          echo "Azure admin web: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_ADMIN_WEB_AZURE_TAG}"
