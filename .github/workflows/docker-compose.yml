name: Docker Compose CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  MPAY_BACKEND_IMAGE: ghcr.io/manav326/mpay-backend
  MPAY_ADMIN_WEB_IMAGE: ghcr.io/manav326/mpay-admin-web
  MPAY_WEB_API_BASE_URL: https://example.invalid
  MPAY_CORS_ALLOWED_ORIGINS: https://example.invalid

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend and admin web images
        run: |
          export MPAY_IMAGE_TAG="${IMAGE_TAG}"
          docker compose -f docker-compose.yml build backend admin-web

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export MPAY_IMAGE_TAG="${IMAGE_TAG}"
          docker compose -f docker-compose.yml push backend admin-web

      - name: Build summary
        if: always()
        run: |
          echo "Backend image: ${MPAY_BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Admin Web image: ${MPAY_ADMIN_WEB_IMAGE}:${IMAGE_TAG}"
