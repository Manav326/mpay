name: Docker Compose CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-compose.yml'
      - 'scripts/mpay-github-update.ps1'
      - 'scripts/mpay-*.ps1'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-compose.yml'
      - 'scripts/mpay-github-update.ps1'
      - 'scripts/mpay-*.ps1'

concurrency:
  group: mpay-docker-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MPAY_BACKEND_IMAGE: ghcr.io/manav326/mpay-backend
  MPAY_ADMIN_WEB_IMAGE: ghcr.io/manav326/mpay-admin-web
  MPAY_WEB_API_BASE_URL: http://192.168.31.47:8080
  MPAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.31.47:3000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Calculate image tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            branch_name="${{ github.event.pull_request.head.ref }}"
            commit_sha="${{ github.event.pull_request.head.sha }}"
            safe_branch="$(echo "${branch_name#feature/}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
            image_tag="feature-${safe_branch}-latest"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            commit_sha="${GITHUB_SHA}"
            image_tag="latest"
          else
            branch_name="${GITHUB_REF_NAME#feature/}"
            safe_branch="$(echo "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
            commit_sha="${GITHUB_SHA}"
            image_tag="feature-${safe_branch}-latest"
          fi

          echo "MPAY_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "MPAY_SHA_TAG=sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "MPAY_COMMIT_SHA=${commit_sha}" >> "${GITHUB_ENV}"

          echo "Selected image tag: ${image_tag}"
          echo "Commit image tag: sha-${commit_sha}"

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config

      - name: Validate local deployment overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local-deploy.yml config
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/mpay-local-deploy.ps1',
            'scripts/mpay-db-backup.ps1',
            'scripts/mpay-db-restore.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Host 'PowerShell deployment scripts parsed successfully.'
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend and admin web images
        run: |
          docker compose -f docker-compose.yml build backend admin-web

      - name: Push branch/main image
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker compose -f docker-compose.yml push backend admin-web

      - name: Tag images with commit SHA
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker tag "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}" "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          docker tag "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}" "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"

      - name: Push commit-tagged images
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker push "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          docker push "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"

      - name: Verify pushed images
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker pull "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"
          docker pull "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"
          docker pull "${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          docker pull "${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"

      - name: Build summary
        if: always()
        run: |
          echo "Backend image: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Admin Web image: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_IMAGE_TAG}"
          echo "Commit backend: ${{ env.MPAY_BACKEND_IMAGE }}:${MPAY_SHA_TAG}"
          echo "Commit admin web: ${{ env.MPAY_ADMIN_WEB_IMAGE }}:${MPAY_SHA_TAG}"
