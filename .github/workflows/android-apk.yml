name: Android APK CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'config/public-hosts.env'
      - 'scripts/mpay-public-config.py'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: mpay-android-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive mPay API and web origins from the single root domain
        run: python3 scripts/mpay-public-config.py --env-file config/public-hosts.env --format github >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Ubuntu 24.04 GitHub runners currently expose API 37 as
          # platforms/android-37.0, not platforms/android-37.
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Normalize Android API 37 SDK path
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "${sdk_root}"
          test -d "${sdk_root}/platforms/android-37.0"

          if [[ ! -e "${sdk_root}/platforms/android-37" ]]; then
            ln -s "android-37.0" "${sdk_root}/platforms/android-37"
          fi

          test -d "${sdk_root}/platforms/android-37"
          echo "Android API 37 SDK path:"
          ls -ld "${sdk_root}/platforms/android-37" "${sdk_root}/platforms/android-37.0"

      - name: Reset Gradle transformed dependency cache
        run: |
          rm -rf ~/.gradle/caches/*/transforms

      - name: Prepare production release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mpay-upload-key.jks"
          test -s "${RUNNER_TEMP}/mpay-upload-key.jks"
          chmod 600 "${RUNNER_TEMP}/mpay-upload-key.jks"

      - name: Validate Android API origin
        shell: bash
        run: |
          python3 - "$MPAY_API_BASE_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = sys.argv[1].strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("MPAY_API_BASE_URL must be a canonical HTTPS origin.")
          print(f"Android API origin validated: https://{parsed.netloc}")
          PY

      - name: Build optimized release APK
        working-directory: android
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MPAY_FIREBASE_API_KEY: ${{ secrets.MPAY_FIREBASE_API_KEY }}
          MPAY_FIREBASE_APP_ID: ${{ secrets.MPAY_FIREBASE_APP_ID }}
          MPAY_FIREBASE_PROJECT_ID: ${{ secrets.MPAY_FIREBASE_PROJECT_ID }}
          MPAY_FIREBASE_SENDER_ID: ${{ secrets.MPAY_FIREBASE_SENDER_ID }}
          MPAY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mpay-upload-key.jks
          MPAY_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MPAY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MPAY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease \
            -PmpayPublicRootUrl="$MPAY_PUBLIC_ROOT_URL" \
            -x :app:lintVitalAnalyzeRelease \
            -x :app:lintVitalReportRelease \
            -x :app:lintVitalRelease

      - name: Verify optimized release APK and AAB and report sizes
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          stat -c "APK_SIZE_BYTES=%s" android/app/build/outputs/apk/release/app-release.apk
          stat -c "AAB_SIZE_BYTES=%s" android/app/build/outputs/bundle/release/app-release.aab
          test -f android/app/build/outputs/mapping/release/mapping.txt
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "${sdk_root}/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Set APK artifact name
        shell: bash
        run: |
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          safe_branch="$(echo "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
          echo "MPAY_APK_ARTIFACT_NAME=mpay-android-release-${safe_branch}" >> "${GITHUB_ENV}"
          echo "APK artifact: mpay-android-release-${safe_branch}"
          echo "Android API origin: ${MPAY_API_BASE_URL}"

      - name: Upload optimized Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: mpay-android-playstore-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MPAY_APK_ARTIFACT_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    needs: android-apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Derive mPay API origin for release metadata
        run: python3 scripts/mpay-public-config.py --env-file config/public-hosts.env --format github >> "$GITHUB_ENV"
      - name: Download signed APK artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: mpay-android-release-main
          path: dist/apk

      - name: Download signed Play Store AAB and R8 mapping
        uses: actions/download-artifact@v4
        with:
          name: mpay-android-playstore-aab
          path: dist/playstore

      - name: Prepare versioned release files
        id: public_release
        shell: bash
        run: |
          apk_path="$(find dist/apk -type f -name '*.apk' -print -quit)"
          aab_path="$(find dist/playstore -type f -name '*.aab' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path"
          test -n "$aab_path" && test -s "$aab_path"
          version_name="$(awk -F '"' '/^[[:space:]]*versionName = / { print $2; exit }' android/app/build.gradle.kts)"
          version_code="$(awk -F '= ' '/^[[:space:]]*versionCode = / { print $2; exit }' android/app/build.gradle.kts)"
          test -n "$version_name" && test -n "$version_code"
          short_sha="${GITHUB_SHA:0:12}"
          tag_name="mpay-android-v${version_name}-build${version_code}-${short_sha}"
          cp "$apk_path" "$RUNNER_TEMP/mpay-android.apk"
          cp "$aab_path" "$RUNNER_TEMP/mpay-android.aab"
          cd "$RUNNER_TEMP"
          sha256sum mpay-android.apk > mpay-android.apk.sha256
          sha256sum mpay-android.aab > mpay-android.aab.sha256
          VERSION_NAME="$version_name" VERSION_CODE="$version_code" MPAY_API_BASE_URL="$MPAY_API_BASE_URL" GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = {
              "applicationId": "com.client.mpay",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "gitCommit": os.environ["GITHUB_SHA"],
              "apiBaseUrl": os.environ["MPAY_API_BASE_URL"],
              "apkSha256": Path("mpay-android.apk.sha256").read_text().split()[0],
              "aabSha256": Path("mpay-android.aab.sha256").read_text().split()[0],
          }
          Path("mpay-android-release.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
          PY
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish versioned signed APK and stable latest download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.public_release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: mPay Android v${{ steps.public_release.outputs.version_name }} · Build ${{ steps.public_release.outputs.version_code }}
          body: |
            Official signed mPay Android release.

            - Version: ${{ steps.public_release.outputs.version_name }} (versionCode ${{ steps.public_release.outputs.version_code }})
            - Commit: ${{ github.sha }}
            - API origin: https://api-mpay.quantaedge.in
            - `mpay-android.apk`: customer installation package.
            - `mpay-android.aab`: Google Play Console upload bundle.
            - SHA-256 checksums and machine-readable release metadata are attached.

            Download customer installations from: https://mpay.quantaedge.in/download
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/mpay-android.apk
            ${{ runner.temp }}/mpay-android.apk.sha256
            ${{ runner.temp }}/mpay-android.aab
            ${{ runner.temp }}/mpay-android.aab.sha256
            ${{ runner.temp }}/mpay-android-release.json
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
