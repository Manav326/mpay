services:
  postgres:
    volumes:
      - mpay_azure_dev_local_postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - mpay_azure_dev_local_redis:/data

  backend:
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config:/app/config:ro
      - mpay_azure_dev_local_profile_images:/app/data/profile-images
      - mpay_azure_dev_local_rental_images:/app/data/rental-images

  admin-web:
    ports:
      - "3000:3000"

volumes:
  mpay_azure_dev_local_postgres:
  mpay_azure_dev_local_redis:
  mpay_azure_dev_local_profile_images:
  mpay_azure_dev_local_rental_images:
