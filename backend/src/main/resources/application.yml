spring:
  config:
    import: optional:file:./config/application-secrets.yml
  datasource:
    url: ${MPAY_DB_URL:jdbc:postgresql://localhost:5432/recharge?options=-c%20TimeZone=Asia%2FKolkata}
    username: ${MPAY_DB_USERNAME:recharge}
    password: ${MPAY_DB_PASSWORD:recharge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${MPAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    access-token-minutes: 30
    refresh-token-days: 30
  auth:
    otp:
      provider: ${MPAY_AUTH_OTP_PROVIDER:way2api}
      ttl-seconds: ${MPAY_AUTH_OTP_TTL_SECONDS:600}
      resend-cooldown-seconds: ${MPAY_AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
      max-sends-per-hour: ${MPAY_AUTH_OTP_MAX_SENDS_PER_HOUR:5}
      verification-token-ttl-seconds: ${MPAY_AUTH_OTP_VERIFICATION_TOKEN_TTL_SECONDS:600}
    password-reset:
      otp-ttl-seconds: 600
      provider: way2api
      twilio:
        enabled: false
  commission:
    company-percent: 1.0
    client-percent: 1.0
  way2api:
    base-url: https://app.way2api.com
    operator-check-path: /api/v1/operator-circle/check
    otp-path: ${MPAY_WAY2API_OTP_PATH:/api/v1/aws/send_otp-pin}
    r-offer-path: /api/v1/mobile/r-offer
    recharge-plans-path: /api/v1/mobile/recharge-plans
    connect-timeout-ms: ${MPAY_WAY2API_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MPAY_WAY2API_READ_TIMEOUT_MS:45000}
    r-offer-read-timeout-ms: ${MPAY_WAY2API_R_OFFER_READ_TIMEOUT_MS:50000}
  recharge:
    operator-providers: way2api,payu
    plan-providers: way2api,payu
    execution-providers: payu
    mock-execution-status: SUCCESS
    offer-cache-ttl-seconds: 86400
    reconciliation:
      enabled: ${MPAY_RECHARGE_RECONCILIATION_ENABLED:true}
      interval-ms: ${MPAY_RECHARGE_RECONCILIATION_INTERVAL_MS:60000}
      initial-delay-ms: ${MPAY_RECHARGE_RECONCILIATION_INITIAL_DELAY_MS:30000}
      batch-size: ${MPAY_RECHARGE_RECONCILIATION_BATCH_SIZE:25}
  rental:
    platform-fee-percent: ${MPAY_RENTAL_PLATFORM_FEE_PERCENT:10.00}
  payment:
    gateway-providers: ${MPAY_PAYMENT_GATEWAY_PROVIDERS:razorpay,payu}
    mock:
      enabled: ${MPAY_PAYMENT_MOCK_ENABLED:true}
  withdrawal:
    provider-order: ${MPAY_WITHDRAWAL_PROVIDER_ORDER:mock,razorpay,payu}
    mock:
      enabled: ${MPAY_WITHDRAWAL_MOCK_ENABLED:true}
  razorpay:
    base-url: https://api.razorpay.com/v1
    payout:
      enabled: ${MPAY_RAZORPAY_PAYOUT_ENABLED:false}
      key-id: ${MPAY_RAZORPAY_PAYOUT_KEY_ID:}
      key-secret: ${MPAY_RAZORPAY_PAYOUT_KEY_SECRET:}
      account-number: ${MPAY_RAZORPAY_PAYOUT_ACCOUNT_NUMBER:}
      contact-id: ${MPAY_RAZORPAY_PAYOUT_CONTACT_ID:}
      purpose: ${MPAY_RAZORPAY_PAYOUT_PURPOSE:payout}
      webhook-secret: ${MPAY_RAZORPAY_PAYOUT_WEBHOOK_SECRET:}
  support-ai:
    provider-enabled: ${MPAY_SUPPORT_AI_PROVIDER_ENABLED:false}
    api-key: ${MPAY_OPENAI_API_KEY:}
    model: ${MPAY_SUPPORT_AI_MODEL:gpt-5.6-luna}
    vector-store-id: ${MPAY_SUPPORT_AI_VECTOR_STORE_ID:}
    base-url: ${MPAY_OPENAI_BASE_URL:https://api.openai.com}
    timeout-ms: ${MPAY_SUPPORT_AI_TIMEOUT_MS:15000}
    max-history-messages: ${MPAY_SUPPORT_AI_MAX_HISTORY_MESSAGES:12}
    max-knowledge-characters: ${MPAY_SUPPORT_AI_MAX_KNOWLEDGE_CHARACTERS:8000}
  calls:
    ringing-timeout-seconds: ${MPAY_CALL_RINGING_TIMEOUT_SECONDS:30}
    signaling-token-ttl-seconds: ${MPAY_CALL_SIGNALING_TOKEN_TTL_SECONDS:300}
    websocket-path: ${MPAY_CALL_WEBSOCKET_PATH:/ws/calls}
    ice-servers: ${MPAY_CALL_ICE_SERVERS:stun:stun.l.google.com:19302}
    turn-username: ${MPAY_CALL_TURN_USERNAME:}
    turn-credential: ${MPAY_CALL_TURN_CREDENTIAL:}
    firebase-service-account-json-base64: ${MPAY_FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
  profile:
    images-dir: ${MPAY_PROFILE_IMAGES_DIR:./data/profile-images}

  payu:
    environment: test
    auth-base-url: https://uat-accounts.payu.in
    nbc-base-url: https://bbps-sb.payu.in
    scope: read_plans
    agent-id: ""
    operator-circle-path: /payu-nbc/v2/nbc/getOperatorAndCircleInfo
    plans-path: /payu-nbc/v3/nbc/getRechargePlans
    custom-plans-path: /payu-nbc/v3/nbc/getCustomizedRechargePlans
    operator-code-mappings: {}
    circle-code-mappings: {}
    biller-category-name: MOBILE PREPAID
    bill-payment-path: /payu-nbc-int/v1/nbc/billpaymentrequest
    status-path: /payu-nbc/v2/nbc/status/billpayment
    payment-mode: WALLET
    wallet-name: PAYU
    pg-name: other
    initiating-channel: AGT
    pg-verify-url: https://test.payu.in/merchant/postservice?form=2
    pg-success-url: https://cbjs.payu.in/sdk/success
    pg-failure-url: https://cbjs.payu.in/sdk/failure
    pg-production: false
    connect-timeout-ms: 10000
    payout:
      enabled: ${MPAY_PAYU_PAYOUT_ENABLED:false}
      environment: ${MPAY_PAYU_PAYOUT_ENVIRONMENT:test}
      auth-base-url: ${MPAY_PAYU_PAYOUT_AUTH_BASE_URL:https://uat-accounts.payu.in}
      api-base-url: ${MPAY_PAYU_PAYOUT_API_BASE_URL:https://uatoneapi.payu.in}
      client-id: ${MPAY_PAYU_PAYOUT_CLIENT_ID:}
      client-secret: ${MPAY_PAYU_PAYOUT_CLIENT_SECRET:}
      payout-merchant-id: ${MPAY_PAYU_PAYOUT_MERCHANT_ID:}
      scope: ${MPAY_PAYU_PAYOUT_SCOPE:create_payout_transactions}
      webhook-authorization: ${MPAY_PAYU_PAYOUT_WEBHOOK_AUTHORIZATION:}
    read-timeout-ms: 30000
