spring:
  config:
    import: optional:file:./config/application-secrets.yml
  datasource:
    url: ${MPAY_DB_URL:jdbc:postgresql://localhost:5432/recharge?options=-c%20TimeZone=Asia%2FKolkata}
    username: ${MPAY_DB_USERNAME:recharge}
    password: ${MPAY_DB_PASSWORD:recharge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    # Browser origins allowed to call the API. Override with MPAY_CORS_ALLOWED_ORIGINS in deployment.
    # Example: https://admin.example.com,https://www.example.com
    allowed-origins: ${MPAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    access-token-minutes: 30
    refresh-token-days: 30
  auth:
    password-reset:
      otp-ttl-seconds: 600
      provider: mock # mock | twilio; switch to twilio when credentials are ready
      twilio:
        enabled: true
  commission:
    company-percent: 1.0
    client-percent: 1.0
  way2api:
    base-url: https://app.way2api.com
    operator-check-path: /api/v1/operator-circle/check
    r-offer-path: /api/v1/mobile/r-offer
    # Keep the backend upstream timeout longer than the Android client timeout.
    # Do not auto-retry operator checks after a timeout because the provider may have
    # accepted/charged the request even when our connection timed out.
    connect-timeout-ms: ${MPAY_WAY2API_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MPAY_WAY2API_READ_TIMEOUT_MS:45000}
    # R-Offer can take a little longer than operator detection; still keep it bounded
    # below the Android 60-second client timeout.
    r-offer-read-timeout-ms: ${MPAY_WAY2API_R_OFFER_READ_TIMEOUT_MS:50000}
  recharge:
    plan-provider: way2api
    execution-provider: mock
    mock-execution-status: SUCCESS
    # R-Offers are number-specific; cache per mobile/operator/circle for 24h.
    # A failed recharge invalidates that mobile's cached offers immediately.
    offer-cache-ttl-seconds: 86400
  razorpay:
    base-url: https://api.razorpay.com/v1
  profile:
    images-dir: ${MPAY_PROFILE_IMAGES_DIR:./data/profile-images}

  payu:
    environment: test
    auth-base-url: https://uat-accounts.payu.in
    nbc-base-url: https://bbps-sb.payu.in
    scope: read_plans
    agent-id: ""
    plans-path: /payu-nbc/v3/nbc/getRechargePlans
    # Temporary development mode: allows testing our internal plans contract while PayU credentials are awaiting verification.
    # Set to false after UAT credentials are verified and operator/circle mappings are configured.
    plan-mock-enabled: true
    operator-code-mappings: {}
    circle-code-mappings: {}
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
