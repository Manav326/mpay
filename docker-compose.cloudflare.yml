# Local production overlay for the existing Cloudflare Tunnel.
# Cloudflare terminates public HTTPS; Caddy is intentionally not enabled here.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${MPAY_DB_PASSWORD:?Set MPAY_DB_PASSWORD in .env.cloudflare}
    volumes:
      - mpay_cloudflare_postgres_data:/var/lib/postgresql/data

  redis:
    volumes:
      - mpay_cloudflare_redis_data:/data

  backend:
    environment:
      MPAY_DB_PASSWORD: ${MPAY_DB_PASSWORD:?Set MPAY_DB_PASSWORD in .env.cloudflare}
      MPAY_CORS_ALLOWED_ORIGINS: ${MPAY_CORS_ALLOWED_ORIGINS:?Set the public mPay web origin}
      MPAY_AUTH_OTP_PROVIDER: ${MPAY_AUTH_OTP_PROVIDER:?Set the approved OTP provider}
      MPAY_PAYMENT_GATEWAY_PROVIDERS: ${MPAY_PAYMENT_GATEWAY_PROVIDERS:?Set configured payment providers}
      MPAY_PAYMENT_MOCK_ENABLED: "false"
      MPAY_WITHDRAWAL_PROVIDER_ORDER: ${MPAY_WITHDRAWAL_PROVIDER_ORDER:razorpay,payu}
      MPAY_WITHDRAWAL_MOCK_ENABLED: "false"
      MPAY_RECHARGE_OPERATOR_PROVIDERS: ${MPAY_RECHARGE_OPERATOR_PROVIDERS:payu,way2api}
      MPAY_RECHARGE_PLAN_PROVIDERS: ${MPAY_RECHARGE_PLAN_PROVIDERS:payu,way2api}
      MPAY_RECHARGE_EXECUTION_PROVIDERS: ${MPAY_RECHARGE_EXECUTION_PROVIDERS:?Set a verified live recharge execution provider}
      MPAY_PAYU_ENVIRONMENT: ${MPAY_PAYU_ENVIRONMENT:?Set PayU production environment}
      MPAY_PAYU_AUTH_BASE_URL: ${MPAY_PAYU_AUTH_BASE_URL:?Set approved PayU live auth URL}
      MPAY_PAYU_NBC_BASE_URL: ${MPAY_PAYU_NBC_BASE_URL:?Set approved PayU live NBC URL}
      MPAY_PAYU_AGENT_ID: ${MPAY_PAYU_AGENT_ID:?Set the approved PayU agent ID}
      MPAY_PAYU_PG_VERIFY_URL: ${MPAY_PAYU_PG_VERIFY_URL:?Set approved PayU live verification URL}
      MPAY_PAYU_PG_SUCCESS_URL: ${MPAY_PAYU_PG_SUCCESS_URL:?Set approved PayU success URL}
      MPAY_PAYU_PG_FAILURE_URL: ${MPAY_PAYU_PG_FAILURE_URL:?Set approved PayU failure URL}
      MPAY_PAYU_PG_PRODUCTION: ${MPAY_PAYU_PG_PRODUCTION:?Set MPAY_PAYU_PG_PRODUCTION=true only for live credentials}
      MPAY_RAZORPAY_PAYOUT_ENABLED: ${MPAY_RAZORPAY_PAYOUT_ENABLED:-false}
      MPAY_PAYU_PAYOUT_ENABLED: ${MPAY_PAYU_PAYOUT_ENABLED:-false}
      MPAY_PAYU_PAYOUT_ENVIRONMENT: ${MPAY_PAYU_PAYOUT_ENVIRONMENT:-production}
      MPAY_SUPPORT_AI_PROVIDER_ENABLED: ${MPAY_SUPPORT_AI_PROVIDER_ENABLED:-false}
      MPAY_CALL_ICE_SERVERS: ${MPAY_CALL_ICE_SERVERS:-stun:stun.l.google.com:19302}
      MPAY_CALL_TURN_USERNAME: ${MPAY_CALL_TURN_USERNAME:-}
      MPAY_CALL_TURN_CREDENTIAL: ${MPAY_CALL_TURN_CREDENTIAL:-}
    volumes:
      - mpay_cloudflare_profile_images:/app/data/profile-images
      - mpay_cloudflare_rental_images:/app/data/rental-images
    networks:
      mpay: {}
      cloudflare-edge:
        aliases:
          - mpay-api

  admin-web:
    image: ${MPAY_ADMIN_WEB_IMAGE:-ghcr.io/manav326/mpay-admin-web}:${MPAY_ADMIN_WEB_TAG:?Set the immutable azure-sha Admin Web image tag}
    networks:
      mpay: {}
      cloudflare-edge:
        aliases:
          - mpay-admin-web

networks:
  cloudflare-edge:
    external: true
    name: cloudflare-edge

volumes:
  mpay_postgres_data:
    external: false
    name: mpay_cloudflare_production_postgres_data
  mpay_redis_data:
    external: false
    name: mpay_cloudflare_production_redis
  mpay_profile_images:
    external: false
    name: mpay_cloudflare_production_profile_images
  mpay_rental_images:
    external: false
    name: mpay_cloudflare_production_rental_images
